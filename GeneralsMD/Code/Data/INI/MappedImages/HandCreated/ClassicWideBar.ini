; The Classic interface's 16:9 command bar, one painting per side, from "C&C Generals HD User
; Interface" by moddb_dev (ModDB), itself built on pWn3d_1337's Operation Firestorm interface, and
; used here with its author's permission.  ControlBarSchemeClassicWide.ini draws them.  The art is
; 1066 design units across at two texels to the unit; mapped images are not in the multiplayer INI checksum.
;
; Each painting is cut one texel in from its left and right edges.  The 2D draw wraps its texture, so
; on a screen that enlarges the art (1440p up) the outermost pixel blended in the far side of the
; 4096 texel sheet, which is empty, and the bar's left edge came out faint.  One texel is half a
; design unit.  On the right each painting's own edge fades out over its last two or three columns,
; and drawn to the screen's edge those let five columns of battlefield through at 1920x1080, so the
; cut there stops a column short of the last fully opaque one, where the filter cannot reach the
; fade: 2128 for America, 2129 for China, 2131 for the GLA.  At the bottom the cut keeps the last opaque row but one, 510, for the same wrap.

MappedImage ClassicWideBarAmerica
  Texture = ClassicWideBarAmerica.tga
  TextureWidth = 4096
  TextureHeight = 512
  Coords = Left:1 Top:128 Right:2128 Bottom:511
  Status = NONE
End

MappedImage ClassicWideBarChina
  Texture = ClassicWideBarChina.tga
  TextureWidth = 4096
  TextureHeight = 512
  Coords = Left:1 Top:142 Right:2129 Bottom:511
  Status = NONE
End

MappedImage ClassicWideBarGLA
  Texture = ClassicWideBarGLA.tga
  TextureWidth = 4096
  TextureHeight = 512
  Coords = Left:1 Top:110 Right:2131 Bottom:511
  Status = NONE
