; Zero Hour Reforged data fixes for the nine generals, loaded after BalanceReforged.ini.
;
; These are mistakes in EA's 1.04 data, not balance: a general's copy of a unit that missed a
; change the original got, a module pointing at the wrong faction's sound, an upgrade icon naming
; an upgrade that does not exist. Every block edits a template in place the way the balance file
; does. A module is swapped with ReplaceModule and a new tag, and a WeaponSet or ArmorSet with the
; same Conditions as one the object already has takes its place.
;
; This file lands in the multiplayer INI checksum.

; ==== Air Force General ==========================================================================

; The Avenger wears AntiAirVehicle, the armor the Avenger had before 1.04. Every other Avenger
; wears AvengerArmor, which takes 23% from jet missiles instead of 30%.
; Without CANNOT_RETALIATE it drives at whatever shoots it, painting the attacker with a target
; laser that does no damage. The USA Avenger has had the flag since 1.04.

Object AirF_AmericaTankAvenger
  KindOf = +CANNOT_RETALIATE
  ArmorSet
    Conditions      = None
    Armor           = AvengerArmor
    DamageFX        = TankDamageFX
  End
End

; The King Raptor buys Countermeasures and gets the flares, and its ArmorUpgrade raises the
; PLAYER_UPGRADE flag, but it has no armor set for that flag, so the armor half of the upgrade
; never reaches it. The USA Raptor has both halves.

Object AirF_AmericaJetRaptor
  ArmorSet
    Conditions      = PLAYER_UPGRADE
    Armor           = CountermeasuresAirplaneArmor
    DamageFX        = None
  End
End

; The Supply Center is marked FS_POWER, so a Saboteur that runs into it steals the money and
; blacks out the whole base for the power plant sabotage time as well.

Object AirF_AmericaSupplyCenter
  KindOf = -FS_POWER
End

; The Air Force General cannot buy Composite Armor, yet the Microwave Tank shows its icon.

Object AirF_AmericaTankMicrowave
  UpgradeCameo5 = None
End

; The Aurora's burning gas cloud has one hit point and nothing marking it untargetable, so enemy
; defences turn and fire at it.

Object AirF_AuroraBombGas
  KindOf = +UNATTACKABLE
End

; Killed by Anthrax Gamma, these soldiers scream with the GLA voice.

