; ==== Toxin General ==============================================================================

; The Tunnel Defender has a ground rocket and an air rocket that reload apart. Swapping between a
; tank and a helicopter it fires the second rocket straight after the first, where every other
; Tunnel Defender has one rocket and waits out its one second reload.

Object Chem_GLAInfantryTunnelDefender
  UpgradeCameo2 = Chem_Upgrade_GLAAnthraxGamma
  WeaponSet
    Conditions            = None
    Weapon                = PRIMARY   Chem_TunnelDefenderRocketWeaponBeta
    AutoChooseSources     = PRIMARY   FROM_PLAYER FROM_AI FROM_SCRIPT
    Weapon                = SECONDARY Chem_TunnelDefenderRocketWeaponBetaAir
    PreferredAgainst      = SECONDARY BALLISTIC_MISSILE AIRCRAFT
    ShareWeaponReloadTime = Yes
  End
  WeaponSet
    Conditions            = PLAYER_UPGRADE
    Weapon                = PRIMARY   Chem_TunnelDefenderRocketWeaponGamma
    AutoChooseSources     = PRIMARY   FROM_PLAYER FROM_AI FROM_SCRIPT
    Weapon                = SECONDARY Chem_TunnelDefenderRocketWeaponGammaAir
    PreferredAgainst      = SECONDARY BALLISTIC_MISSILE AIRCRAFT
    ShareWeaponReloadTime = Yes
  End
End

; The Rebel shows Camouflage, which the Toxin General cannot buy, and hides AP Bullets, which it
; can and which the Rebel's rifle uses.

Object Chem_GLAInfantryRebel
  UpgradeCameo3 = Upgrade_GLAAPBullets
End

Object Chem_GLAInfantryTerrorist
  UpgradeCameo2 = Upgrade_GLAAnthraxBeta
End

; ==== Demolition General =========================================================================

; With the Demo upgrade the Stinger Site fires the suicide charge, 500 damage over 18, when it is
; merely destroyed; every other Demo building fires Demo_DestroyedWeapon, 50 over 60. A poison
; death fires no charge. A suicide fires two 700 charges, one from a module that is always on and
; one from the upgrade. It now fires one.

Object Demo_GLAStingerSite
  UpgradeCameo2 = Demo_Upgrade_SuicideBomb
  RemoveModule ModuleTag_Death18
  ReplaceModule ModuleTag999
    Behavior = FireWeaponWhenDeadBehavior ModuleTag999_Fix
      DeathWeapon         = Demo_DestroyedWeapon
      StartsActive        = No
      TriggeredBy         = Demo_Upgrade_SuicideBomb
      DeathTypes          = ALL -SUICIDED
    End
  End
End

Object Demo_GLATunnelNetwork
  UpgradeCameo1 = Demo_Upgrade_SuicideBomb
End

; The Rebel's Booby Trap is unlocked by an upgrade that has no icon on the Rebel.

Object Demo_GLAInfantryRebel
  UpgradeCameo4 = Upgrade_GLAInfantryRebelBoobyTrapAttack
End

; ==== Stealth General ============================================================================

; The Stealth General's Rebel is born hidden and drops out of hiding every time it is hit. No
; other hidden unit does; the plain Rebel with Camouflage does not.

Object Slth_GLAInfantryRebel
  ReplaceModule ModuleTag_07
    Behavior = StealthUpdate ModuleTag_07_Fix
      StealthDelay                         = 2500
      StealthForbiddenConditions           = ATTACKING USING_ABILITY
      MoveThresholdSpeed                   = 3
      InnateStealth                        = Yes
      OrderIdleEnemiesToAttackMeUponReveal = Yes
    End
  End
End

; Under Camo Netting the Palace stays hidden while the five soldiers inside it shoot out, so the
; enemy can see who is killing it and cannot fire back at the building.

Object Slth_GLAPalace
  ReplaceModule ModuleStealth_09
    Behavior = StealthUpdate ModuleStealth_09_Fix
      StealthDelay                         = 2500
      StealthForbiddenConditions           = ATTACKING USING_ABILITY TAKING_DAMAGE RIDERS_ATTACKING
      InnateStealth                        = No
      OrderIdleEnemiesToAttackMeUponReveal = Yes
    End
  End
End

