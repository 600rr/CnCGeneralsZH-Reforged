; ==== Infantry General ===========================================================================

; The Minigunner has no SquishCollide, the module every other soldier uses to die under a tank,
; so vehicles push it aside instead of running it over.

Object Infa_ChinaInfantryMiniGunner
  UpgradeCameo3 = Upgrade_Nationalism
  AddModule
    Behavior = SquishCollide ModuleTag_Squish_Fix
    End
  End
End

; The Tank Hunter's first icon names UPGRADE:Fanaticism, the upgrade's text label rather than
; the upgrade, so the slot stays empty. Nationalism, which the Infantry General gets for free,
