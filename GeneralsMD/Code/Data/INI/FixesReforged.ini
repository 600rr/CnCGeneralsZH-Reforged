; Every Nuke Cannon carries the Neutron Shell in its only weapon set, with FROM_AI among the
; sources allowed to pick it. A cannon on guard or attack move, or one the computer owns, can fire
; neutron shells before anyone has paid for them. The shell now sits in the upgraded set alone.

Object Infa_ChinaVehicleNukeLauncher
  WeaponSet
    Conditions            = None
    Weapon                = PRIMARY NukeCannonGun
    AutoChooseSources     = PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
  End
  WeaponSet
    Conditions            = PLAYER_UPGRADE
    Weapon                = PRIMARY NukeCannonGun
    Weapon                = SECONDARY NukeCannonNeutronWeapon
    AutoChooseSources     = PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
    AutoChooseSources     = SECONDARY FROM_SCRIPT FROM_AI
    ShareWeaponReloadTime = Yes
  End
  AddModule
    Behavior = WeaponSetUpgrade ModuleTag_NeutronShells_Fix
      TriggeredBy = Upgrade_ChinaNeutronShells
    End
  End
End

