; ---- tanks and cars build up speed and brake for it ----------------------------------------------
;
; EA gave these Acceleration and Braking of 1000 (their own first numbers are still in the comments
; of Locomotor.ini: 240 and 50), which takes a 30-speed tank from rest to top speed in one frame and
; back in another. They now take about 1.2 seconds to get up to speed, a light vehicle about one, and
; three quarters of a second to stop. The drive that uses them is Locomotor::moveTowardsPositionVehicle.
; A Locomotor block here edits EA's template in place, like an Object block; AccelerationDamaged is
; named because EA's file set it to 1000 too.

