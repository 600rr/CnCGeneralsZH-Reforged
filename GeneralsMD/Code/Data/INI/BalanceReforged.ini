; The Paladin's point defense laser shot down every Patriot missile: Paladins killed a Patriot four
; times of four and lost 0.28 of its price, where Crusaders lost 1.35 and never killed it. Firing
; every two seconds it still thins a volley, and the Patriot stands two times of four at 0.55.
; Its duels do not move, the laser only meets missiles.

Weapon PaladinPointDefenseLaser
  DelayBetweenShots = 2000   ; EA: 1000
End

; The Rocket Buggy reached 300 and every defence but the Fire Base reaches 225, so buggies took any
; tower and lost nothing. At 250 and 275 that stayed true. At 225 the tower always won. At 235 the
; buggies still take a Patriot, a Gattling Cannon or a Bunker most of the time and lose 0.2 to 0.8
; of its price doing it.

Weapon BuggyRocketWeapon
  AttackRange = 235.0   ; EA: 300
End

Weapon BuggyRocketWeaponUpgraded
  AttackRange = 235.0   ; EA: 300
End

Weapon BuggyRocketREDWeapon
  AttackRange = 235.0   ; EA: 300
End

; ---- the Comanche's chin gun turns ---------------------------------------------------------------
;
; EA put the cannon and the missiles on one invisible "turret" with no turn rate, only so the
; Comanche could fire on the move, which left both pointing straight ahead and the whole helicopter
; swinging round to aim. The cannon now sits on a turret of its own that slews 120 degrees a second
; and reaches 120 degrees either side of the nose (TurretYawLimit); a target further round turns
; the body just far enough to bring it into that arc. The missiles stay fixed forward on a second
; turret that does not turn, so a missile shot still puts the nose on the target. The turret does
; not pitch: the model has no gun bone to show it, and the cannon's hit does not depend on pitch.
; Every Comanche gets the same module; the replaced JetAIUpdate keeps the object's Locomotor sets.

Object AmericaVehicleComanche
  ReplaceModule ModuleTag_06
    Behavior = JetAIUpdate ModuleTag_06_Reforged
      MinHeight                     = 5
      NeedsRunway                   = No
      KeepsParkingSpaceWhenAirborne = No
      AutoAcquireEnemiesWhenIdle    = Yes
      Turret
        TurretTurnRate        = 120
        TurretPitchRate       = 0
        TurretYawLimit        = 120
        ControlledWeaponSlots = PRIMARY
      End
      AltTurret
        TurretTurnRate        = 0
        TurretPitchRate       = 0
        ControlledWeaponSlots = SECONDARY
      End
    End
  End
End

