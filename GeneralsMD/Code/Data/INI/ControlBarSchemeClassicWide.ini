; The Classic interface's 16:9 command bar.  Every scheme in EA's ControlBarScheme.ini has a twin
; here for the same side.  Classic stretches the bar as the game shipped it, across the screen up to
; 16:9 and across a centred 16:9 frame on anything wider (HudRectForScreen), and wears whichever
; twin's shape is nearer the screen's (ControlBarSchemeManager,
; findSchemeForSide): this one on 16:10 and wider, EA's 800x600 on 4:3 and 5:4.  The Reforged
; interface never uses these.
;
; Each block is EA's scheme with its painting swapped for MappedImages/HandCreated/ClassicWideBar.ini
; and its window corners (the ...UL/...LR pairs) taken from "C&C Generals HD User Interface" by
; moddb_dev (ModDB), built on pWn3d_1337's Operation Firestorm interface and used with its author's
; permission, for the side whose painting it wears.  Coordinates are the mod's 1066x600: EA's 800 sits
; in the middle, so x 133 here is EA's 0.  Not in the multiplayer INI checksum.
;
; Each painting's ImagePart runs down to y 600.  The mod's own sizes stopped a unit or two short of
; it, and the battlefield showed through along the bottom edge of the screen.

