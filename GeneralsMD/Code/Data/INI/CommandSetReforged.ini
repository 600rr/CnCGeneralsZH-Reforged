; Corrections to EA's command buttons and command sets. ControlBar::init loads this after
; CommandSet.ini with INI_LOAD_MULTIFILE: a button block edits EA's button in place and names
; only what changes, and a set block replaces the set whole. GameEngine::init adds its bytes to
; the multiplayer INI CRC, as it does for CommandSet.ini.

; ==== Buttons =====================================================================================

; The Nuke MiG upgrade is the one China tank and silo upgrade that cannot be started on low power;
; Neutron Shells, sold from the same silo, carries IGNORES_UNDERPOWERED.

CommandButton Command_UpgradeChinaTacticalNukeMig
  Options = IGNORES_UNDERPOWERED
End

; ==== China Command Centers after Mines ===========================================================

; Buying Mines swaps the Command Center to its Upgrade set, and the Infantry and Nuke copies of that
; set were written from other sets: the Infantry one lost Frenzy and put the plain Carpet Bomb and
; Napalm Strike in place of the general's own, which it cannot use, and the Nuke one lost Frenzy.
; Each is now its general's normal set with EMP Mines in slot 12.

CommandSet Infa_ChinaCommandCenterCommandSetUpgrade
  1  = Infa_Command_ConstructChinaDozer
  2  = Early_Command_ChinaCarpetBomb
  3  = Infa_Command_Paradrop
  4  = Command_ClusterMines
  6  = Command_ArtilleryBarrage
  7  = Command_EmergencyRepair
  8  = Command_EMPPulse
  9  = Command_UpgradeChinaRadar
  10 = Early_Command_Frenzy
  12 = Command_UpgradeEMPMines
  13 = Command_SetRallyPoint
  14 = Command_Sell
End

CommandSet Nuke_ChinaCommandCenterCommandSetUpgrade
  1  = Nuke_Command_ConstructChinaDozer
  2  = Nuke_Command_ChinaCarpetBomb
  3  = Command_NapalmStrike
  4  = Command_ClusterMines
  5  = Command_CashHack
  6  = Command_ArtilleryBarrage
  7  = Early_Command_EmergencyRepair
  8  = Command_EMPPulse
  9  = Command_UpgradeChinaRadar
  10 = Command_Frenzy
  12 = Command_UpgradeEMPMines
  13 = Command_SetRallyPoint
  14 = Command_Sell
End

; The Infantry barracks after Mines swaps the general's own capture-building upgrade for the plain
; one.

CommandSet Infa_ChinaBarracksCommandSetUpgrade
  1  = Infa_Command_ConstructChinaInfantryMiniGunner
  2  = Infa_Command_ConstructChinaInfantryTankHunter
  3  = Infa_Command_ConstructChinaInfantryHacker
  4  = Infa_Command_ConstructChinaInfantryBlackLotus
  7  = Infa_Command_UpgradeChinaRedguardCaptureBuilding
  12 = Command_UpgradeEMPMines
  13 = Command_SetRallyPoint
  14 = Command_Sell
End

; ==== Missing orders ==============================================================================

; The ECM Tank has no Attack Move and the Troop Crawlers no Guard, where every other China combat
; vehicle has both.

CommandSet ChinaVehicleECMTankCommandSet
  1  = Command_ChinaTankECMDisableVehicle
  11 = Command_AttackMove
  13 = Command_Guard
  14 = Command_Stop
End

CommandSet Tank_ChinaVehicleECMTankCommandSet
