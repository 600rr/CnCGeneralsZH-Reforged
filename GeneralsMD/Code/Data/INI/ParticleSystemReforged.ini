; Grey smoke behind the rockets that EA drew as a thin additive streak and nothing else: the Tank
; Hunter's and the Missile Defender's, the Comanche's and Raptor's pods, the Patriot. The streak
; already spends its one slave on the lens flare, so the smoke hangs off the flare (ParticleSys.cpp
; feeds a slave's slave from the master's particle). It is alpha-blended and billboarded, so the
; sun's smoke map takes it and it shades the ground under Direct3D 11. Under two seconds on screen,
; and it fades before it widens past a tank. BurstCount is the puffs laid along the path between two
; bursts of the streak, which the Comanche's pods fire every second frame. The name holds no "smoke", so -smoke
; leaves it alone. Scud, Tomahawk, TOW and Neutron missiles had smoke already and keep EA's.

